name:                kanban
version:             0.1.0.0
github:              "sokomadeyo1/kanban"
license:             BSD-3-Clause
author:              "Tihonov Yuri"
maintainer:          "sokomadeyo1@proton.me"
copyright:           "2026 Tihonov Yuri"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/sokomadeyo1/kanban#readme>

dependencies:
- base >= 4.7 && < 5
- ghc
- shakespeare
- shellwords
- sqlite-simple
- text
- yesod
- yesod-core
- yesod-form

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  kanban-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kanban

tests:
  kanban-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kanban
